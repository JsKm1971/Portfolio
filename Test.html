<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Showcase</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

/* =====================
   GLOBAL
===================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Roboto', sans-serif;
    background:#fff;
    color:#333;
    line-height:1.6;
}

/* =====================
   HEADER
===================== */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:#fff;
    box-shadow:0 2px 15px rgba(0,0,0,.05);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo img{
    height:200px;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    text-decoration:none;
    color:#444;
    font-weight:500;
    transition:.3s;
}

nav a:hover{
    color:#0F4C81;
}

/* =====================
   LAYOUT
===================== */
main{
    max-width:1400px;
    margin:auto;
}

/* =====================
   HERO
===================== */
.hero{
    text-align:center;
    padding:100px 40px;
    margin:40px 0;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(15,76,129,.08);
}

.hero h1{
    font-size:3.5rem;
    color:#000052;
}

.hero h2{
    font-size:1.3rem;
    font-weight:300;
    margin:20px 0;
}

.hero p{
    max-width:700px;
    margin:auto;
}

/* =====================
   SECTION
===================== */
.section{
    margin:60px 0;
    padding:50px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(15,76,129,.08);
    transition:.3s;
}

.section:hover{
    transform:translateY(-3px);
}

.section h2{
    text-align:center;
    font-size:2rem;
    color:#000052;
    margin-bottom:30px;
}

/* =====================
   BUTTONS
===================== */
.cta-btn{
    display:inline-block;
    padding:12px 24px;
    margin-top:20px;
    background:#0F4C81;
    color:white;
    border:none;
    border-radius:50px;
    cursor:pointer;
    text-decoration:none;
}

/* =====================
   CASE STUDY
===================== */
.case-study{
    display:grid;
    grid-template-columns:1fr 1.5fr;
    gap:40px;
    align-items:center;
}

.case-study iframe{
    width:100%;
    height:450px;
    border:none;
    border-radius:16px;
}

.case-text ul{
    margin-top:20px;
    padding-left:20px;
}

/* =====================
   GRIDS
===================== */
.learning-grid,
.case-grid,
.gallery{
    display:grid;
    gap:25px;
}

.learning-grid{
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
}

.case-grid{
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
}

.gallery{
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}

/* =====================
   CARDS
===================== */
.learning-card,
.case-card{
    background:#fff;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.learning-card h3{
    padding:15px;
}

.learning-card iframe{
    width:100%;
    aspect-ratio:16/9;
    border:none;
}

.case-card{
    padding:30px;
}

.meta span{
    display:inline-block;
    background:#f0f4f8;
    padding:5px 10px;
    margin-right:10px;
    border-radius:20px;
}

/* =====================
   DETAILS TOGGLE
===================== */
.details-content{
    max-height:0;
    overflow:hidden;
    transition:.3s;
}

.details-content.open{
    max-height:200px;
    margin-top:15px;
}

/* =====================
   VIDEO
===================== */
.video-container{
    position:relative;
    padding-bottom:56.25%;
    height:0;
}

.video-container iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
}

/* =====================
   GALLERY
===================== */
.gallery-item img{
    width:100%;
    border-radius:12px;
    cursor:pointer;
}

/* =====================
   LIGHTBOX
===================== */
.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
}

.lightbox img{
    max-width:90%;
}

/* =====================
   MOBILE
===================== */
@media (max-width:768px){
    .hero h1{
        font-size:2.3rem;
    }
